<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦潮｜水彩泡沫稿</title>
<style>
  :root { --ink: #1f3b49; --ink-soft: #5a7180; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e2e5e4; color: var(--ink); font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 1340px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-family: "Noto Serif SC", "Songti SC", STSong, serif; font-weight: 600; font-size: 28px; margin: 0 0 6px; }
  .lead { margin: 0 0 28px; color: var(--ink-soft); font-size: 15px; max-width: 60em; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
  figure { margin: 0; }
  .frame { position: relative; aspect-ratio: 16 / 10; background: #f4f5f2; overflow: hidden; border-radius: 6px; }
  .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); width: 32%; }
  .copy h2 { margin: 0 0 10px; font-family: "Noto Serif SC", "Songti SC", STSong, serif; font-weight: 600; font-size: clamp(20px, 2.6vw, 34px); letter-spacing: .04em; }
  .copy p { margin: 0; font-size: clamp(10px, .95vw, 13px); line-height: 1.8; color: var(--ink-soft); }
  figcaption { padding: 14px 2px 0; }
  figcaption b { font-family: "Noto Serif SC", "Songti SC", STSong, serif; font-size: 19px; font-weight: 600; }
  figcaption b span { color: var(--ink-soft); font-weight: 500; margin-right: 8px; }
  figcaption p { margin: 6px 0 0; font-size: 14px; line-height: 1.7; color: var(--ink-soft); }
  .busy { position: absolute; inset: 0; display: grid; place-content: center; color: var(--ink-soft); font-size: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>水彩泡沫</h1>
  <p class="lead">泡沫按 ref-20、ref-24、ref-25 的画法逐像素绘制：不规则的多边形泡孔、颜料沉在泡与泡之间、泡心留出纸白、颜料颗粒和飞溅、边缘参差地散开，再加一层纸张纹理。截图周围不围框。两张只差截图和泡沫的关系。</p>
  <div class="grid" id="grid"></div>
</main>
<script>
(() => {
  const W = 1280, H = 800;   // render space; the frame shows it at 16:10
  const options = [
    { id: 'E1', name: '截图浮在泡沫上', text: '一片水彩泡沫从右上斜着流到左下，截图浮在泡沫上方，四边渐隐。泡沫在截图两侧露出，形状参差，不围成框。两个关键词各占一个较大的空泡孔。' },
    { id: 'E2', name: '截图落在大泡孔里', text: '截图落在泡沫中一个特别大的空泡孔里，泡孔的边是颜料沉积出来的，只在右侧和下方有泡沫，左上方直接留白。关键词同样在空泡孔里。' },
  ];

  // ---------- noise ----------
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1, y * 2.1) * .27 + vnoise(x * 4.3, y * 4.3) * .15 + vnoise(x * 8.7, y * 8.7) * .08;
  const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // Pigments taken from ref-25 / ref-24: tide green, sea blue, leaf green, a touch of rose.
  const pigments = [[52, 140, 132], [62, 120, 184], [110, 170, 80], [196, 110, 140]];
  const paper = [244, 245, 242];

  // Openings: organic pebbles (screen) and soft rounds (keyword cells). sdf < 0 inside.
  function pebble(cx, cy, hw, hh, p, wob, seed) {
    return (x, y) => {
      const dx = (x - cx) / hw, dy = (y - cy) / hh;
      const a = Math.atan2(dy, dx);
      const n = (vnoise(Math.cos(a) * 2 + seed, Math.sin(a) * 2 + seed) - .5) * wob;
      const s = Math.pow(Math.pow(Math.abs(dx), p) + Math.pow(Math.abs(dy), p), 1 / p) - 1 - n;
      return s * Math.min(hw, hh);
    };
  }

  function render(variant) {
    const rnd = mulberry(variant === 'E1' ? 7 : 19);
    const screen = { x: 860, y: 400, w: 0, h: 600 };
    screen.w = screen.h * (1260 / 2676);
    const openings = [];
    if (variant === 'E2') openings.push(pebble(screen.x, screen.y, screen.w / 2 + 70, screen.h / 2 + 60, 3.2, .1, 1.3));
    const kw = variant === 'E1' ? [[1112, 238, 66], [1080, 552, 60]] : [[1124, 300, 62], [1062, 610, 56]];
    for (const [x, y, r] of kw) openings.push(pebble(x, y, r, r * .92, 2, .16, x * .01));
    const sdfOpen = (x, y) => { let m = 1e9; for (const f of openings) m = Math.min(m, f(x, y)); return m; };

    // Where the foam lives: a few soft lobes plus noise, ragged at the edge.
    const lobes = variant === 'E1'
      ? [[1080, 170, 330, 230], [900, 420, 280, 330], [640, 690, 300, 170], [1180, 640, 220, 200]]
      : [[1130, 380, 260, 420], [930, 700, 340, 170], [760, 640, 140, 120], [1220, 120, 140, 130]];
    const field = (x, y) => {
      let m = -1;
      for (const [cx, cy, rx, ry] of lobes) m = Math.max(m, 1 - ((x - cx) / rx) ** 2 - ((y - cy) / ry) ** 2);
      return m + (fbm(x * .006 + 3, y * .006) - .5) * 1.1;
    };

    // Seeds by Poisson-disk dart throwing: locally even spacing, as in real foam, with the spacing itself
    // varying across the raft so large calm cells sit beside patches of finer foam.
    const G = 32, cols = Math.ceil(W / G) + 1, rows = Math.ceil(H / G) + 1;
    const grid = Array.from({ length: cols * rows }, () => []);
    const spacing = (x, y) => 22 + Math.pow(fbm(x * .0035 + 9, y * .0035 + 2), 1.5) * 70;
    for (let n = 0; n < 60000; n++) {
      const x = rnd() * W, y = rnd() * H;
      if (field(x, y) < -.4 || sdfOpen(x, y) < 8) continue;
      const sp = spacing(x, y), gx = Math.floor(x / G), gy = Math.floor(y / G);
      let ok = true;
      for (let j = -3; j <= 3 && ok; j++) for (let i = -3; i <= 3 && ok; i++) {
        const cx = gx + i, cy = gy + j;
        if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) continue;
        for (const o of grid[cy * cols + cx]) if (Math.hypot(o[0] - x, o[1] - y) < Math.min(sp, o[2])) { ok = false; break; }
      }
      if (ok) grid[gy * cols + gx].push([x, y, sp]);
    }

    const img = new ImageData(W, H);
    const d = img.data;
    for (let y = 0; y < H; y++) {
      const gy = Math.floor(y / G);
      for (let x = 0; x < W; x++) {
        const gx = Math.floor(x / G);
        const grain = (hash(x, y) - .5) * 7;
        let r = paper[0] + grain, g = paper[1] + grain, b = paper[2] + grain;
        const m = field(x, y);
        const so = sdfOpen(x, y);
        let a = 0, wall = 0;
        if (m > -.3 || so < 40) {
          // Foam cells: distance to the cell wall is the gap between the nearest seeds (d2 - d1);
          // a smooth minimum with the third seed rounds the corners, so pigment pools where three walls meet.
          let d1 = 1e9, d2 = 1e9, d3 = 1e9, near = null;
          for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
            const cx = gx + i, cy = gy + j;
            if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) continue;
            for (const sd of grid[cy * cols + cx]) {
              const dd = (sd[0] - x) * (sd[0] - x) + (sd[1] - y) * (sd[1] - y);
              if (dd < d1) { d3 = d2; d2 = d1; d1 = dd; near = sd; } else if (dd < d2) { d3 = d2; d2 = dd; } else if (dd < d3) d3 = dd;
            }
          }
          d1 = Math.sqrt(d1); d2 = Math.sqrt(d2); d3 = Math.sqrt(d3);
          const e2 = d2 - d1, e3 = d3 - d1, k = 5;
          let f = -k * Math.log(Math.exp(-e2 / k) + Math.exp(-e3 / k));
          f = Math.max(0, f + (vnoise(x * .08, y * .08) - .5) * 2.5);
          const inOpen = so < 0;
          const rim = inOpen ? -so : Math.min(f, Math.max(0, so));
          const cell = Math.min(80, d2);
          const ww = 1.4 + cell * .03;
          wall = 1 - smooth(0, ww * 1.5, rim);
          const pool = Math.exp(-rim / (2.5 + cell * .07));
          const presence = inOpen ? smooth(-.2, .3, m + .5) : smooth(-.12, .22, m);
          const gran = .72 + vnoise(x * .35, y * .35) * .38 + (hash(x * 3, y * 7) - .5) * .25;
          // Each cell holds its own amount of pigment, like a print where some bubbles kept more colour.
          const held = near && !inOpen ? .03 + Math.pow(hash(near[0] | 0, near[1] | 0), 2.2) * .2 : 0;
          a = (wall * .5 + pool * .22 + held) * presence * gran;
        }
        // Splatter outside the foam (ref-25 left edge).
        if (m > -.9 && m < .05 && hash(x >> 2, y >> 2) > .9965) {
          const cx = (x >> 2) * 4 + 2, cy = (y >> 2) * 4 + 2, rr = 1 + hash(x >> 2, (y >> 2) + 9) * 1.6;
          if ((x - cx) ** 2 + (y - cy) ** 2 < rr * rr) a = Math.max(a, .55);
        }
        if (a > 0) {
          const t = fbm(x * .0022 + (variant === 'E1' ? 0 : 5), y * .0022 + 1) * 3.2;
          const i = Math.max(0, Math.min(2, Math.floor(t))), k = Math.max(0, Math.min(1, t - i));
          const c0 = pigments[i], c1 = pigments[Math.min(3, i + 1)];
          const dark = 1 - wall * .22;
          const pr = (c0[0] + (c1[0] - c0[0]) * k) * dark, pg = (c0[1] + (c1[1] - c0[1]) * k) * dark, pb = (c0[2] + (c1[2] - c0[2]) * k) * dark;
          a = Math.min(.85, a);
          r = r * (1 - a) + pr * a; g = g * (1 - a) + pg * a; b = b * (1 - a) + pb * a;
          // A few dark flecks of undissolved pigment near the walls.
          if (wall > .5 && hash(x * 13, y * 17) > .9993) { r *= .55; g *= .6; b *= .62; }
        }
        const o = (y * W + x) * 4;
        d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255;
      }
    }
    return { img, screen, kw };
  }

  function feathered(img, w, h) {
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    const o = off.getContext('2d');
    o.drawImage(img, 0, 0, w, h);
    o.globalCompositeOperation = 'destination-in';
    const gv = o.createLinearGradient(0, 0, 0, h); gv.addColorStop(0, 'rgba(0,0,0,0)'); gv.addColorStop(.05, '#000'); gv.addColorStop(.95, '#000'); gv.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = gv; o.fillRect(0, 0, w, h);
    const gh = o.createLinearGradient(0, 0, w, 0); gh.addColorStop(0, 'rgba(0,0,0,0)'); gh.addColorStop(.07, '#000'); gh.addColorStop(.93, '#000'); gh.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = gh; o.fillRect(0, 0, w, h);
    return off;
  }

  const grid = document.getElementById('grid');
  const shot = new Image();
  shot.src = '/dreamtide-website/media/编辑-隐.jpg';
  const figs = options.map((o) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<div class="frame"><canvas width="${W}" height="${H}"></canvas><div class="busy">正在绘制泡沫…</div><div class="copy"><h2>梦的层次</h2><p>保存之后，补上情绪、标签和梦里的人。<br>也能写注记，把私密的片段藏起来。</p></div></div>
      <figcaption><b><span>${o.id}</span>${o.name}</b><p>${o.text}</p></figcaption>`;
    grid.appendChild(fig);
    return fig;
  });
  shot.onload = () => document.fonts.ready.then(() => {
    options.forEach((o, i) => setTimeout(() => {
      const fig = figs[i];
      const ctx = fig.querySelector('canvas').getContext('2d');
      const { img, screen, kw } = render(o.id);
      ctx.putImageData(img, 0, 0);
      const x = screen.x - screen.w / 2, y = screen.y - screen.h / 2;
      if (o.id === 'E1') {
        // A pale veil under the screen lifts it off the foam without drawing an edge.
        ctx.save(); ctx.filter = 'blur(26px)'; ctx.fillStyle = 'rgba(246,247,244,.92)';
        ctx.beginPath(); ctx.roundRect(x - 14, y - 10, screen.w + 28, screen.h + 20, 60); ctx.fill(); ctx.restore();
      }
      ctx.drawImage(feathered(shot, screen.w * 2, screen.h * 2), x, y, screen.w, screen.h);
      ctx.fillStyle = '#1f3b49'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '500 32px "Noto Serif SC", "Songti SC", STSong, serif';
      ctx.fillText('标签', kw[0][0], kw[0][1]);
      ctx.fillText('隐私', kw[1][0], kw[1][1]);
      fig.querySelector('.busy').remove();
    }, 60 + i * 60));
  });
})();
</script>
</body>
</html>
