function updateMicroParticles(dt,t){

    const site=sites[siteIndex],rx=site.r*xScale,ry=site.r*yScale*(mobile?1.2:1);
    if(((x-site.x)/rx)**2+((y-site.y)/ry)**2<.82)return index;
  }
  return -1;
}
function openScreen(index){
  const source=[image,tagsImage,privateImage][index];
  document.querySelector('#fullImage').src=source.src;
  document.querySelector('#overlay').classList.add('is-open');
  document.querySelector('#close').focus();
}
for(const surface of [canvas,glCanvas]){
  let press=null;
  surface.addEventListener('pointermove',e=>{
    pointer.x=e.clientX;pointer.y=e.clientY;
    surface.style.cursor=screenAt(e.clientX,e.clientY)>=0?'pointer':'crosshair';
  });
  surface.addEventListener('pointerdown',e=>{
    pointer.down=true;pointer.x=e.clientX;pointer.y=e.clientY;
    press={x:e.clientX,y:e.clientY,at:performance.now()};
    surface.setPointerCapture(e.pointerId);
  });
  surface.addEventListener('pointerup',e=>{
    pointer.down=false;pointer.x=e.clientX;pointer.y=e.clientY;
    if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)<9&&
      performance.now()-press.at<650){
      const index=screenAt(e.clientX,e.clientY);
      if(index>=0)openScreen(index);
    }
    press=null;
  });
  surface.addEventListener('pointercancel',()=>{pointer.down=false;press=null});
  surface.addEventListener('pointerleave',()=>{
    if(!pointer.down){pointer.x=-1000;pointer.y=-1000;pointer.previousX=-1000;pointer.previousY=-1000}
  });
  surface.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();openScreen(0)}
  });
}
function setVariant(n){variant=(n+3)%3;reset()}document.querySelector('#prev').onclick=()=>setVariant(variant-1);document.querySelector('#next').onclick=()=>setVariant(variant+1);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setVariant(variant-1);if(e.key==='ArrowRight')setVariant(variant+1);if(e.key==='Escape')document.querySelector('#overlay').classList.remove('is-open')});
document.querySelector('#close').onclick=()=>document.querySelector('#overlay').classList.remove('is-open');
window.addEventListener('resize',resize);const webglReady=!params.has('forceCanvas')&&initGL();resize();
if(webglReady){drawGL(performance.now());image.decode().then(()=>drawGL(performance.now())).catch(()=>{});}
else draw(performance.now());
function tick(){if(!document.hidden)(webglReady?drawGL:draw)(performance.now());
  setTimeout(tick,webglReady?16:70)}
setTimeout(tick,webglReady?16:70);
</script>
